name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie-slim
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Cache node_modules, dist
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            dist
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

  test:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: node:24-trixie-slim
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit
          path: junit.xml

  test-cdk-synth:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: node:24-trixie-slim
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Synthesize CDK stack
        # Sanity-checks the infra code compiles/synthesizes correctly - not a real deploy, so this
        # deliberately needs no AWS credentials (the stack must not perform environment-dependent
        # context lookups that would require them).
        run: yarn synth

  validate:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: node:24-trixie-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Run validation script
        run: |
          set +e
          bash ./validate.sh

  publish-npm-package:
    runs-on: ubuntu-latest
    needs: [test, test-cdk-synth]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    environment: publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
